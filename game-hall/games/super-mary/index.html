<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f0" />
    <title>王子历险记 · CREDIUS ARCADE</title>
    <link rel="preload" href="assets/mountain-valley.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="assets/explorer-sprite.png" as="image" type="image/png" />
    <link rel="stylesheet" href="../../src/game-shell.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../../theme.css" />
  </head>
  <body>
    <main class="game-shell mary-shell">
      <header class="game-topbar">
        <button id="backLobby" class="shell-button" type="button" aria-label="返回大厅">←</button>
        <div class="game-title">
          <strong>王子历险记</strong>
          <span>星辉山谷 · 原创横版历险</span>
        </div>
        <div class="game-stats" aria-label="远征状态">
          <div class="stat-pill"><span>分数</span><strong id="score">0</strong></div>
          <div class="stat-pill"><span>生命</span><strong id="lives">3</strong></div>
          <div class="stat-pill"><span>金币</span><strong id="coins">0</strong></div>
          <div class="stat-pill"><span>大金币</span><strong id="bigCoins">0/3</strong></div>
          <div class="stat-pill"><span>进度</span><strong id="progress">0%</strong></div>
        </div>
        <div class="game-actions">
          <button id="pauseGame" class="shell-button text" type="button">暂停</button>
          <button id="newGame" class="shell-button" type="button" aria-label="重新开始">↻</button>
          <button id="soundGame" class="shell-button" type="button" aria-label="声音开关">♪</button>
        </div>
      </header>

      <section class="mary-layout playfield">
        <div class="mary-stage">
          <canvas id="maryBoard" width="1280" height="720" tabindex="0" role="application" aria-label="山谷横版动作关卡"></canvas>
          <div class="stage-vignette" aria-hidden="true"></div>
          <div id="abilityBar" class="ability-bar" aria-live="polite"></div>
          <div id="statusPanel" class="status-panel" hidden>
            <div class="status-card" role="status" aria-live="polite">
              <span id="statusKicker">远征暂停</span>
              <strong id="statusTitle">在断桥前整备</strong>
              <button id="statusButton" type="button">继续</button>
            </div>
          </div>
          <div id="settlementPanel" class="settlement-panel" hidden>
            <div class="settlement-card" role="status" aria-live="polite">
              <small id="settlementKicker">远征记录</small>
              <h2 id="settlementTitle">抵达山谷出口</h2>
              <div class="settlement-grid">
                <div class="settlement-metric"><span>本局得分</span><strong id="finalScore">0</strong></div>
                <div class="settlement-metric"><span>金币</span><strong id="finalCoins">0</strong></div>
                <div class="settlement-metric"><span>大金币</span><strong id="finalBigCoins">0 / 3</strong></div>
                <div class="settlement-metric"><span>用时</span><strong id="finalTime">00:00</strong></div>
              </div>
              <div class="settlement-actions">
                <button id="playAgain" type="button">再闯一次</button>
                <button id="shareResult" class="light" type="button">分享成绩</button>
                <button id="settlementLobby" class="light" type="button">返回大厅</button>
              </div>
              <p id="shareOutput" class="share-output" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <div class="mary-controls" aria-label="触控操作">
          <div>
            <button type="button" data-control="left" aria-label="向左">←</button>
            <button type="button" data-control="right" aria-label="向右">→</button>
          </div>
          <button class="jump-control" type="button" data-control="jump" aria-label="跳跃">跳跃</button>
        </div>
      </section>
    </main>

    <script src="../../src/hamsterBalance.js"></script>
    <script src="../../src/storage.js"></script>
    <script src="../../src/campaign.js"></script>
    <script src="jumpRules.js"></script>
    <script src="world.js"></script>
    <script src="entities.js"></script>
    <script src="game.js"></script>
  </body>
</html>
