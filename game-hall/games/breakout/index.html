<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f0" />
    <title>打砖块 · CREDIUS ARCADE</title>
    <link rel="stylesheet" href="../../src/game-shell.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../../theme.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-topbar">
        <button id="backLobby" class="shell-button" type="button" aria-label="返回大厅">←</button>
        <div class="game-title">
          <strong>打砖块</strong>
          <span>CREDIUS ARCADE · 街机</span>
        </div>
        <div class="game-stats" aria-label="计分">
          <div class="stat-pill"><span>分数</span><strong id="score">0</strong></div>
          <div class="stat-pill"><span>历史最高</span><strong id="best">0</strong></div>
          <div class="stat-pill"><span>生命</span><strong id="lives">3</strong></div>
          <div class="stat-pill"><span>关卡</span><strong id="level">1</strong></div>
          <div class="stat-pill"><span>剩余砖</span><strong id="target">31</strong></div>
          <div class="stat-pill"><span>时间</span><strong id="timer">0:00</strong></div>
        </div>
        <div class="game-actions">
          <button id="pauseGame" class="shell-button text" type="button">暂停</button>
          <button id="newGame" class="shell-button" type="button" aria-label="重新开始">↻</button>
          <button id="soundGame" class="shell-button" type="button" aria-label="声音开关">♪</button>
        </div>
      </header>

      <section id="levelSelectPanel" class="level-select-panel" aria-labelledby="levelSelectTitle">
        <div class="level-select-heading">
          <div>
            <span>HANDCRAFTED CAMPAIGN</span>
            <h1 id="levelSelectTitle">选择打砖块关卡</h1>
            <p>按顺序清空砖阵：可破坏砖块归零才算通关。</p>
          </div>
          <strong>5 / 12 已制作</strong>
        </div>
        <div id="levelCards" class="level-cards" aria-label="打砖块关卡地图"></div>
        <p class="reserved-levels"><span>第 6–12 关</span> 已保留扩展接口，将在后续加入新机关。</p>
      </section>

      <section id="gameStage" class="breakout-layout playfield" hidden>
        <div class="mission-strip" aria-live="polite">
          <div>
            <span id="missionKicker">第 1 关</span>
            <strong id="missionTitle">新手训练场</strong>
          </div>
          <p id="missionFeature">控制落点，清空所有可破坏砖块。</p>
          <button id="chooseLevel" type="button">选关</button>
        </div>
        <div class="board-wrap">
          <canvas id="breakoutBoard" width="480" height="640" tabindex="0" role="application" aria-label="打砖块球场"></canvas>
          <div id="comboNotice" class="combo-notice" aria-live="polite"></div>
          <button id="canvasPause" class="canvas-pause" type="button" aria-label="暂停游戏">Ⅱ</button>
          <div id="statusPanel" class="status-panel" hidden>
            <div class="status-card" role="status" aria-live="polite">
              <span id="statusKicker"></span>
              <strong id="statusTitle"></strong>
              <button id="statusButton" type="button"></button>
            </div>
          </div>
          <div id="settlementPanel" class="settlement-panel" hidden>
            <div class="settlement-card" role="status" aria-live="polite">
              <small id="settlementKicker">本局结束</small>
              <h2 id="settlementTitle">成绩结算</h2>
              <div class="settlement-grid">
                <div class="settlement-metric"><span>本局得分</span><strong id="finalScore">0</strong></div>
                <div class="settlement-metric"><span>历史最高</span><strong id="finalBest">0</strong></div>
                <div class="settlement-metric"><span>通关时间</span><strong id="finalTime">0:00</strong></div>
                <div class="settlement-metric"><span>剩余生命</span><strong id="finalLives">0</strong></div>
              </div>
              <div id="clearResult" class="clear-result" aria-label="清场结果">清场完成</div>
              <p id="rewardSummary" class="rating-hint"></p>
              <div class="settlement-actions">
                <button id="playAgain" type="button">再玩一次</button>
                <button id="shareResult" class="light" type="button">分享成绩</button>
                <button id="settlementLobby" class="light" type="button">返回大厅</button>
              </div>
              <p id="shareOutput" class="share-output" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <div class="control-panel" aria-label="触控操作">
          <button type="button" data-control="left" aria-label="向左">←</button>
          <button type="button" data-control="launch" aria-label="发球">发球</button>
          <button type="button" data-control="right" aria-label="向右">→</button>
        </div>
      </section>
    </main>

    <script src="../../src/hamsterBalance.js"></script>
    <script src="../../src/storage.js"></script>
    <script src="../../src/campaign.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
  </body>
</html>
