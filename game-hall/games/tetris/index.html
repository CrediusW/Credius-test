<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f0" />
    <title>俄罗斯方块 · CREDIUS ARCADE</title>
    <link rel="stylesheet" href="../../src/game-shell.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../../theme.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-topbar">
        <button id="backLobby" class="shell-button" type="button" aria-label="返回大厅">←</button>
        <div class="game-title">
          <strong>俄罗斯方块</strong>
          <span>CREDIUS ARCADE · 反应</span>
        </div>

        <div class="game-stats" aria-label="计分">
          <div class="stat-pill"><span>分数</span><strong id="score">0</strong></div>
          <div class="stat-pill"><span>历史最高</span><strong id="best">0</strong></div>
          <div class="stat-pill"><span>关卡</span><strong id="level">1/3</strong></div>
          <div class="stat-pill"><span>本关消行</span><strong id="lines">0/20</strong></div>
        </div>

        <div class="game-actions">
          <button id="pauseGame" class="shell-button text" type="button">暂停</button>
          <button id="newGame" class="shell-button" type="button" aria-label="重新开始">↻</button>
          <button id="soundGame" class="shell-button" type="button" aria-label="声音开关">♪</button>
        </div>
      </header>

      <section class="tetris-layout playfield">
        <div class="board-wrap">
          <canvas id="tetrisBoard" width="300" height="600" tabindex="0" role="application" aria-label="俄罗斯方块棋盘"></canvas>
          <div id="statusPanel" class="status-panel" hidden>
            <div class="status-card" role="status" aria-live="polite">
              <span id="statusKicker"></span>
              <strong id="statusTitle"></strong>
              <button id="statusButton" type="button"></button>
            </div>
          </div>
          <div id="settlementPanel" class="settlement-panel" hidden>
            <div class="settlement-card" role="status" aria-live="polite">
              <small id="settlementKicker">本局结束</small>
              <h2 id="settlementTitle">成绩结算</h2>
              <div class="settlement-grid">
                <div class="settlement-metric"><span>本局得分</span><strong id="finalScore">0</strong></div>
                <div class="settlement-metric"><span>历史最高</span><strong id="finalBest">0</strong></div>
              </div>
              <div class="settlement-actions">
                <button id="playAgain" type="button">再玩一次</button>
                <button id="shareResult" class="light" type="button">分享成绩</button>
                <button id="settlementLobby" class="light" type="button">返回大厅</button>
              </div>
              <p id="shareOutput" class="share-output" aria-live="polite"></p>
            </div>
          </div>
        </div>

        <aside class="next-panel">
          <div>
            <span>下一个</span>
            <canvas id="nextPiece" width="96" height="96" aria-label="下一个方块"></canvas>
          </div>
          <p>共 3 关，每关消除 20 行。方向键移动，上键旋转，下键软降，空格硬降。</p>
        </aside>

        <div class="control-panel" aria-label="触控操作">
          <button type="button" data-control="left" aria-label="左移">←</button>
          <button type="button" data-control="rotate" aria-label="旋转">↻</button>
          <button type="button" data-control="right" aria-label="右移">→</button>
          <button type="button" data-control="down" aria-label="软降">↓</button>
          <button type="button" data-control="drop" aria-label="硬降">落</button>
        </div>
      </section>
    </main>

    <script src="../../src/hamsterBalance.js"></script>
    <script src="../../src/storage.js"></script>
    <script src="../../src/campaign.js"></script>
    <script src="lineRules.js"></script>
    <script src="progressRules.js"></script>
    <script src="game.js"></script>
  </body>
</html>
