<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 — 闻风的奇妙天地</title><link rel="stylesheet" href="assets/account.css"></head><body><header><a href="/">← 闻风的奇妙天地</a><span>你的私人小天地</span></header><main class="login"><p class="eyebrow">A SPACE OF YOUR OWN</p><h1>欢迎回来。</h1><p>使用闻风分配给你的账号，打开自己的求职工具和小元房间。</p><form class="card" id="login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="32" autocapitalize="none"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div class="actions"><button type="submit">进入我的空间 →</button></div><p id="message" class="error" role="status"></p></form><p>账号由闻风发放。忘记密码时请联系闻风重置。</p></main><script>
document.getElementById('login').onsubmit=async function(e){e.preventDefault();const button=this.querySelector('button');button.disabled=true;const message=document.getElementById('message');message.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.username.value.trim(),password:this.password.value})});let data;try{data=await r.json();}catch{throw new Error('登录服务尚未接通，请联系闻风');}if(!r.ok)throw new Error(data.error?.message||'登录失败');const next=new URLSearchParams(location.search).get('next')||'/space.html';location.href=/^\/(?!\/)/.test(next)&&!next.includes('\\')?next:'/space.html';}catch(error){message.textContent=error.message;}finally{button.disabled=false;}};
</script></body></html>
