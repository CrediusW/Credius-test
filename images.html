<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片工坊 — 闻风的奇妙天地</title><link rel="stylesheet" href="assets/account.css"><style>.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px}.image-card img{width:100%;height:190px;object-fit:contain;border-radius:12px;background:#f0f1e8}.image-card h2{font-size:17px;overflow-wrap:anywhere}.controls{display:flex;gap:16px;flex-wrap:wrap}.controls label{flex:1;min-width:150px;margin:0}select{display:block;width:100%;font:inherit;border:1px solid #cad5cc;border-radius:10px;padding:11px;background:#fff;margin-top:8px}.image-card{margin:0}.image-card p{font-size:13px}.file-drop{border:1px dashed #b8cabb;padding:18px;border-radius:12px}#status{min-height:24px}</style></head><body><header><a href="/space.html">← 我的空间</a><span>IMAGE STUDIO</span></header><main><p class="eyebrow">A LITTLE ROOM FOR YOUR IMAGES</p><h1>让图片，刚刚好。</h1><p>上传图片，调整大小、裁成方形，或转换成适合分享的格式。图片保存在你的个人空间里。</p><section class="card"><form id="upload"><label for="file">选择 JPEG、PNG 或 WebP 图片</label><input class="file-drop" id="file" type="file" accept="image/jpeg,image/png,image/webp" required><p>单张最多 5 MB、2000 万像素；每账号最多 100 张、100 MB。</p><button id="uploadButton">上传到我的空间 ↗</button></form><p id="status" role="status"></p><div class="controls"><label>输出尺寸<select id="size"><option value="320">320 px · 缩略图</option><option value="800" selected>800 px · 常用尺寸</option><option value="1600">1600 px · 大图</option></select></label><label>输出格式<select id="format"><option value="webp">WebP · 适合网页</option><option value="jpeg">JPEG · 通用照片</option><option value="png">PNG · 保留透明</option></select></label><label>画面处理<select id="fit"><option value="contain">等比缩放</option><option value="cover">方形裁剪</option></select></label></div></section><p id="empty">正在打开图片空间…</p><div id="gallery" class="gallery"></div></main><script src="assets/account.js"></script><script>
Wenfeng.ready.then(async()=>{
 const api=Wenfeng.api,status=document.getElementById('status'),gallery=document.getElementById('gallery');let images=[];
 function message(text,bad=false){status.textContent=text;status.className=bad?'error':'';}
 function url(id){return '/api/images/'+id+'/file?'+new URLSearchParams({size:document.getElementById('size').value,format:document.getElementById('format').value,fit:document.getElementById('fit').value});}
 async function download(href,name){try{const r=await fetch(href);if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'图片暂时无法下载');}const object=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=object;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(object),1000);}catch(e){message(e.message,true);}}
 function render(){gallery.replaceChildren();document.getElementById('empty').textContent=images.length?'':'还没有图片。上传第一张，试试转换效果。';images.forEach(image=>{
  const card=document.createElement('article');card.className='card image-card';
  const preview=document.createElement('img');preview.alt=image.name;preview.loading='lazy';if(image.ready)preview.src=url(image.id);
  preview.onerror=()=>{message('图片转换暂时不可用，你仍可下载原图。',true);};
  const title=document.createElement('h2');title.textContent=image.name;
  const detail=document.createElement('p');detail.textContent=image.width+' × '+image.height+' · '+(image.bytes/1024/1024).toFixed(2)+' MB'+(image.ready?'':' · 尚未保存完成');
  const actions=document.createElement('div');actions.className='actions';
  if(image.ready){const save=document.createElement('button');save.textContent='下载转换图';save.onclick=()=>download(url(image.id),image.name.replace(/\.[^.]+$/,'')+'.'+document.getElementById('format').value);const original=document.createElement('button');original.className='secondary';original.textContent='原图';original.onclick=()=>download('/api/images/'+image.id+'/file?original=1',image.name);actions.append(save,original);}
  const remove=document.createElement('button');remove.className='secondary';remove.textContent='删除';remove.onclick=async()=>{if(!confirm('删除“'+image.name+'”？'))return;remove.disabled=true;try{await api('/api/images/'+image.id,{method:'DELETE',body:'{}'});await load();message('图片已删除');}catch(e){message(e.message,true);}finally{remove.disabled=false;}};actions.append(remove);card.append(preview,title,detail,actions);gallery.append(card);
 });}
 async function load(){images=await api('/api/images');render();}
 for(const id of ['size','format','fit'])document.getElementById(id).onchange=render;
 document.getElementById('upload').onsubmit=async function(e){e.preventDefault();const file=document.getElementById('file').files[0];if(!file)return;if(file.size>5*1024*1024)return message('单张图片最多 5 MB，请先缩小图片。',true);const button=document.getElementById('uploadButton');button.disabled=true;message('正在上传…');try{const r=await fetch('/api/images',{method:'POST',headers:{'Content-Type':file.type,'X-File-Name':encodeURIComponent(file.name)},body:file});const result=await r.json();if(!r.ok)throw new Error(result.error?.message||'上传失败');this.reset();await load();message('上传完成，选择尺寸和格式即可下载。');}catch(e){message(e.message,true);}finally{button.disabled=false;}};
 try{await load();}catch(e){document.getElementById('empty').textContent='图片空间尚未连接，请稍后再来。';message(e.message,true);document.getElementById('uploadButton').disabled=true;}
}).catch(()=>{});
</script></body></html>
