<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的空间 — 闻风的奇妙天地</title><link rel="stylesheet" href="assets/account.css"></head><body><header><a href="/">← 闻风的奇妙天地</a><span>PRIVATE SPACE</span></header><main><p class="eyebrow">WELCOME TO YOUR CORNER</p><h1 id="welcome">正在打开个人空间…</h1><p id="model"></p><div class="card"><h2>把准备落到实处。</h2><p>简历、匹配记录和面试练习保存在你的账号下。</p><a class="button" href="/joblens/">打开 JobLens ↗</a></div><div class="card"><h2>和小元聊一会儿。</h2><p>聊天记录和人格设置，跟着你的账号走。</p><a class="button" href="/ai-voice-pet/">进入小元的房间 ↗</a></div><div class="card"><h2>给图片一个家。</h2><p>上传图片、生成缩略图、方形裁剪，转换 WebP、JPEG 或 PNG。</p><a class="button" href="/images.html">打开图片工坊 ↗</a></div><section class="card" id="admin" hidden><h2>分发新账号</h2><p>每人一组账号和密码。生成的密码只显示这一次，请保存后分发。</p><form id="create"><label for="newName">新账号</label><input id="newName" pattern="[a-z][a-z0-9_-]{2,31}" required placeholder="例如 friend_001"><div class="actions"><button>生成账号和密码</button></div></form><pre id="credential" hidden></pre><p id="error" class="error" role="status"></p><ul id="users"></ul></section></main><script src="assets/account.js"></script><script>
Wenfeng.ready.then(async()=>{const api=Wenfeng.api;document.getElementById('welcome').textContent='你好，'+Wenfeng.user.username+'。';document.getElementById('model').textContent=Wenfeng.user.ai?'站长提供的 AI 已接通。在线调用会把相关文本发送给 OpenAI。':'AI 尚未接通；你可以先使用本地简历分析和离线小元。';if(Wenfeng.user.role!=='admin')return;document.getElementById('admin').hidden=false;
async function list(){const users=await api('/api/users'),ul=document.getElementById('users');ul.replaceChildren();users.forEach(user=>{const li=document.createElement('li'),label=document.createElement('span');label.textContent=user.username+(user.disabled?' · 已停用':' · 可使用');li.append(label);if(user.id!==Wenfeng.user.id){for(const reset of [false,true]){const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=reset?'重置密码':user.disabled?'启用':'停用';b.onclick=async()=>{b.disabled=true;try{if(reset&&!confirm('重置 '+user.username+' 的密码，并退出其登录？'))return;const result=await api('/api/users/'+user.id,{method:'PATCH',body:JSON.stringify(reset?{reset:true}:{disabled:!user.disabled})});if(result.password)show(user.username,result.password);await list();}catch(e){document.getElementById('error').textContent=e.message;}finally{b.disabled=false;}};li.append(b);}}ul.append(li);});}
function show(name,password){const box=document.getElementById('credential');box.hidden=false;box.textContent='账号：'+name+'\n密码：'+password+'\n登录：'+location.origin+'/login.html';}
document.getElementById('create').onsubmit=async function(e){e.preventDefault();const b=this.querySelector('button');b.disabled=true;document.getElementById('error').textContent='';try{const result=await api('/api/users',{method:'POST',body:JSON.stringify({username:document.getElementById('newName').value.trim()})});show(result.username,result.password);this.reset();await list();}catch(e){document.getElementById('error').textContent=e.message;}finally{b.disabled=false;}};await list();}).catch(()=>{});
</script></body></html>
